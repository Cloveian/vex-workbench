# vex parts catalog
# inches everywhere, bleh

[grid]
pitch = 0.5
hole = 0.182
round = 0.02 # hole corners
end = 0.25
past_bend = 0.296 # outside of a bend to the first hole center

[metal]
thickness = { Aluminum = 0.062, Steel = 0.046 }
bend = 0.032 # inside radius, steel and al steps both
marks = 5 # count notches on the free edges, every 5 holes
mark = 0.0798 # 45 deg V, this deep

# generated parts

[[family]]
id = "c-channel"
folder = "Structure/{material}/{width}x C-Channel"
name = "1x{width}x1x{holes} {material} C-Channel"
material = ["Aluminum", "Steel"]
# between = the staggered row down the middle, only the 2 wide has it
sizes = [{ width = 2, between = true }, { width = 3 }, { width = 5 }]
holes = { from = 1, to = 35 }
flange = 0.546
chamfer = 0.064 # flange tip corners on the cut ends
fixtures = [
  "1x2x1x25 Aluminum C-Channel (276-2288)",
  "1x2x1x35 Aluminum C-Channel (276-2289)",
  "1x2x1x35 Steel C-Channel (276-2906)",
